<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minu kalender</title>

    <!-- Siin ütleme HTML-ile, et kasuta välist stiilifaili (style.css) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- wrapper hoiab kogu sisu koos ja tsentreerib selle -->
    <div class="wrapper">

        <!-- Siia (calendari sisse) joonistab JavaScript kalendri tabeli.
             See on alguses tühi – kogu sisu tekib script.js abil. -->
        <div id="calendari"></div>

        <footer>
            Minu esimene kalender 🌸
        </footer>

    </div>

    <!-- Siin ütleme HTML-ile, et kasuta välist skriptifaili (script.js).
         See rida peab olema keha (body) lõpus, et HTML oleks juba olemas,
         kui skript käivitub. -->
    <script src="script.js"></script>

</body>
</html>
